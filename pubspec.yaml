name: e_taxi
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.33+39
environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http:
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  provider: ^6.1.2
  http_interceptor: ^2.0.0-beta.8
  shared_preferences: ^2.2.3
  rxdart: ^0.28.0
  flutter_svg: ^2.0.10+1
  connectivity_plus:
  country_pickers: ^3.0.1
  image_picker: ^1.2.0
  camera: ^0.11.2
  path_provider: ^2.1.5
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  geocoding: ^4.0.0
  flutter_polyline_points: ^3.0.1
  cached_network_image:
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.0.0
  google_sign_in: ^6.3.0
  firebase_auth: ^6.0.2
  flutter_dotenv: ^6.0.0
  skeletonizer: ^2.1.0+1
  intl: ^0.20.2
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2
  geolocator: ^14.0.2
  web_socket_channel: ^3.0.3
  flutter_rating_bar:
  dotted_line: ^3.2.3
  dotted_border: ^3.1.0
  url_launcher: ^6.3.2
  jwt_decoder: ^2.0.1
  flutter_staggered_grid_view: ^0.7.0
  share_plus: ^12.0.0
  fl_chart: ^0.71.0
  permission_handler: ^12.0.1
  open_filex: ^4.5.0
  country_phone_validator: ^1.0.1
  webview_flutter: ^4.13.0
  flutter_html: ^3.0.0
  map_launcher: ^4.4.2
  carousel_slider: ^5.1.1
  in_app_review:
  sms_autofill: ^2.4.1
  otp_text_field: ^1.1.3
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#001428"
  adaptive_icon_foreground: "assets/icon/icon.png"
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true




flutter:


  uses-material-design: true


  assets:
    - assets/.env
    - assets/font/
    - assets/icons/
    - assets/images/
    - assets/
    - assets/splace.png



  fonts:
    - family: Outfit
      fonts:
        - asset: assets/font/OutfitRegular.ttf
          weight: 400
        - asset: assets/font/OutfitMedium.ttf
          weight: 500
        - asset: assets/font/OutfitSemiBold.ttf
          weight: 600
        - asset: assets/font/OutfitBold.ttf
          weight: 700