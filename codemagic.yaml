workflows:
  android-debug:
    name: Veszpremi Taxi - Sofor debug APK
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: 3.41.9
      java: 17
      ndk: 29.0.14206865

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Google Maps kulcs ellenorzese
        script: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "HIBA: A GOOGLE_MAPS_API_KEY Codemagic valtozo nincs beallitva."
            exit 1
          fi

      - name: Android local.properties letrehozasa
        script: |
          printf "sdk.dir=%s\nflutter.sdk=%s\ngoogle.maps.api.key=%s\n" "$ANDROID_SDK_ROOT" "$FLUTTER_ROOT" "$GOOGLE_MAPS_API_KEY" > "$CM_BUILD_DIR/android/local.properties"

      - name: Flutter csomagok letoltese
        script: |
          flutter pub get

      - name: Debug APK epitese
        script: |
          flutter build apk --debug --target-platform android-arm64 --no-pub

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
